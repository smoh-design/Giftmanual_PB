<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선물포장 적요 생성기</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --canvas:#E3E7E0;      /* bg/canvas — 액션 버튼 배경 */
    --surface:#FBFBF8;     /* bg/surface — 카드, 검색창, 집계 */
    --surface-2:#F2F3EE;   /* bg/surface-2 — 페이지 배경 */
    --white:#FFFFFF;
    --ink:#131E1A;
    --soft:#5C6A63;
    --faint:#8D9891;
    --on-dark:#F6F7F4;
    --line:#CBD2C8;
    --line-soft:#DFE3DB;
    --brass:#8A6B2E;
    --celadon:#3F7565;
    --celadon-soft:#E1EDE7;
    --alert:#9A4A2C;
    --alert-soft:#F5E6DF;
    --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','SF Pro','Helvetica Neue','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  }

  *{box-sizing:border-box;letter-spacing:0}
  body{
    margin:0;background:var(--surface-2);color:var(--ink);
    font-family:var(--sf);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px 64px}

  /* ── 헤더 (Figma: pad 32/0/20, gap 8) ── */
  header{padding:32px 0 20px;display:flex;flex-direction:column;gap:8px}
  h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:40px}
  .sub{margin:0;color:var(--soft);font-size:13px;line-height:20px;max-width:640px}

  /* ── 집계 = 상태 필터 (Figma: cell pad 11/14, gap 2) ── */
  .tally-wrap{padding-top:10px}
  .tally{
    display:grid;grid-template-columns:repeat(5,1fr);
    border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface);
  }
  .tally button{
    all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;
    padding:11px 14px;border-right:1px solid var(--line-soft);
    font-family:var(--sf);transition:background .12s;
  }
  .tally button:last-child{border-right:0}
  .tally button:hover{background:var(--surface-2)}
  .tally button:focus-visible{outline:2px solid var(--celadon);outline-offset:-2px}
  .tally b{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:24px;font-variant-numeric:tabular-nums}
  .tally span{font-size:10.5px;color:var(--faint);line-height:14px}
  .tally button[aria-pressed=true]{background:var(--canvas)}
  .tally button[aria-pressed=true] b{color:var(--ink)}
  .tally button[aria-pressed=true] span{color:var(--soft)}

  /* ── 컨트롤 (Figma: gap 20, pad-bottom 20, 하단 보더) ── */
  .controls{
    position:sticky;top:0;z-index:20;background:var(--surface-2);
    display:flex;flex-direction:column;gap:20px;
    padding:12px 0 20px;border-bottom:1px solid var(--line);
  }
  .searchrow{display:flex;gap:8px}
  input[type=search]{
    flex:1;min-width:0;font-family:var(--sf);font-size:14px;line-height:20px;
    padding:10px 12px;letter-spacing:0;
    border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);
  }
  input[type=search]::placeholder{color:var(--faint)}
  input:focus,textarea:focus{outline:2px solid var(--celadon);outline-offset:-1px;border-color:transparent}
  button{font-family:var(--sf);cursor:pointer;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:0}
  button:focus-visible{outline:2px solid var(--celadon);outline-offset:1px}
  .btn-solid{background:var(--ink);color:var(--on-dark);border-color:var(--ink);padding:10px 16px;font-weight:600;font-size:13px;line-height:20px;white-space:nowrap}

  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{padding:5px 11px;font-size:12px;line-height:16px;border-radius:100px;color:var(--soft);background:transparent;border:1px solid var(--line)}
  .fchip[aria-pressed=true]{background:var(--ink);color:var(--on-dark);border-color:var(--ink);font-weight:600}

  /* ── 액션 바 (Figma: 버튼 fill=canvas + line 보더, pad 9/14, Medium 12.5) ── */
  .actionbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:22px 0}
  .actionbar .act{
    background:var(--canvas);border:1px solid var(--line);
    padding:9px 14px;font-size:12.5px;line-height:18px;font-weight:500;color:var(--ink);
  }
  .actionbar .act:hover{background:var(--line-soft)}
  .status{
    font-size:11.5px;line-height:16px;font-weight:600;color:var(--soft);margin-left:auto;
    background:transparent;border:1px solid transparent;padding:6px 10px;text-align:right;
  }
  .status:hover{border-color:var(--line);background:var(--surface)}

  /* ── 상품 카드 (Figma: pad 30/24/14, gap 12) ── */
  .row{background:var(--surface);border:1px solid var(--line);border-top:0;padding:30px 24px 14px}
  .row:first-of-type{border-top:1px solid var(--line);border-radius:3px 3px 0 0}
  .row:last-of-type{border-radius:0 0 3px 3px}

  .brand{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}

  /* Name Block: gap 50, pad 3/0/20 */
  .body{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:15px 0 20px}

  /* 좌측: 상하 분리 (Figma Frame 7: gap 24, 상단 lead / 하단 tail) */
  .col-l{display:flex;flex-direction:column;justify-content:space-between;gap:24px}
  .lead{display:flex;flex-direction:column;gap:12px}
  .pname{font-size:17px;font-weight:700;color:var(--soft);line-height:21px;letter-spacing:-0.01em}
  .parts{font-size:15px;font-weight:600;color:var(--soft);line-height:1.25}
  .fields{display:flex;flex-direction:column;gap:6px;padding-top:7px}
  .fields input{
    width:100%;font-family:var(--sf);font-size:12px;line-height:17px;padding:7px 9px;letter-spacing:0;
    border:1px solid var(--line-soft);border-radius:2px;background:var(--surface-2);color:var(--ink);
  }
  .fields input::placeholder{color:var(--faint)}

  .tail{display:flex;flex-direction:column;gap:12px}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:600;line-height:15px;padding:4px 6px;border-radius:2px}
  .pill.tag{background:var(--celadon-soft);color:var(--celadon)}
  .pill.chk{background:var(--alert-soft);color:var(--alert)}
  .note{font-size:11px;color:var(--alert);line-height:16px}

  /* 우측 (Figma Frame 6: gap 12) */
  .col-r{display:flex;flex-direction:column;gap:12px}
  .r-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .r-head{font-size:14px;font-weight:700;color:var(--soft);line-height:1.2}
  .r-acts{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .rsave{
    flex:0 0 auto;background:var(--ink);color:var(--on-dark);border-color:var(--ink);
    padding:7px 12px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;
  }
  .rsave:hover{background:#000}
  .rsave:disabled{background:var(--surface-2);color:var(--faint);border-color:var(--line);cursor:default}
  .rsave.done{background:var(--celadon);border-color:var(--celadon);color:var(--white)}
  .ricon{
    flex:0 0 auto;width:32px;height:32px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--soft);
  }
  .ricon:hover{background:var(--canvas);color:var(--ink)}
  .ricon svg{width:16px;height:16px;display:block}
  .groups{display:flex;flex-direction:column}
  .group{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .group:last-child{border-bottom:0}
  .g-label{font-size:14px;font-weight:700;color:var(--soft);line-height:1.2}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{
    padding:6px 10px;font-size:12px;line-height:16px;border-radius:2px;
    background:var(--surface-2);border:1px solid var(--line-soft);color:var(--soft);
    transition:background .12s,color .12s,border-color .12s;
  }
  .chip:hover{border-color:var(--celadon)}
  .chip[aria-pressed=true]{background:var(--celadon);border-color:var(--celadon);color:var(--white);font-weight:600}
  .chip.dep[aria-pressed=true]{background:var(--celadon-soft);border-color:var(--celadon);color:var(--celadon)}

  /* ── 적요 스트립 (Figma: 액센트 바 없음, lab pad 11/9, out pad 10, cp pad 0/15) ── */
  .strip{display:flex;margin-top:11px;border:1px solid var(--line);background:var(--white);border-radius:2px;overflow:hidden}
  .strip>.lab{flex:0 0 auto;align-self:center;padding:0 9px 0 11px;font-size:12px;font-weight:700;color:var(--brass);white-space:nowrap}
  .strip>.out{
    flex:1;min-width:0;padding:10px 10px 10px 0;font-family:var(--sf);font-size:13px;font-weight:500;
    line-height:19px;color:var(--ink);border:0;background:transparent;resize:none;overflow:hidden;letter-spacing:0;
  }
  .strip>.out::placeholder{color:var(--faint)}
  .strip>.cp{
    flex:0 0 auto;border:0;border-left:1px solid var(--line-soft);border-radius:0;
    padding:0 15px;font-size:12px;font-weight:600;color:var(--soft);background:var(--surface-2);
  }
  .strip>.cp:hover,.strip>.cp.done{background:var(--celadon);color:var(--white)}

  .warn{font-size:11px;color:var(--alert);margin-top:6px}
  .editnote{font-size:10.5px;color:var(--brass);margin-top:6px;display:flex;gap:8px;align-items:center}
  .editnote button{border:0;background:transparent;color:var(--faint);text-decoration:underline;font-size:10.5px;padding:0}

  .empty-state{padding:40px 16px;text-align:center;color:var(--faint);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:3px}

  dialog{border:1px solid var(--line);border-radius:4px;padding:0;background:var(--surface);max-width:min(560px,92vw);width:100%}
  dialog::backdrop{background:rgba(19,30,26,.42)}
  .dlg{padding:20px}
  .dlg h2{margin:0 0 4px;font-size:16px;letter-spacing:-0.02em}
  .dlg p{margin:0 0 12px;font-size:12px;color:var(--soft)}
  .dlg textarea{width:100%;height:230px;font-family:var(--sf);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);line-height:1.6;letter-spacing:0}
  .hlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:2px;overflow:hidden;max-height:320px;overflow-y:auto}
  .hitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line-soft);background:var(--white)}
  .hitem:last-child{border-bottom:0}
  .hitem .ht{flex:1;min-width:0}
  .hitem .htime{font-size:12px;font-weight:600;line-height:16px}
  .hitem .hsum{font-size:11px;color:var(--faint);line-height:15px}
  .hitem button{flex:0 0 auto;padding:6px 10px;font-size:11.5px;font-weight:600}
  .hempty{padding:28px 16px;text-align:center;color:var(--faint);font-size:12px;line-height:18px;background:var(--white)}

  .dlg .acts{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
  .dlg .acts button{padding:8px 14px;font-size:12.5px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:820px){
    .wrap{padding:0 16px 48px}
    h1{font-size:25px;line-height:31px}
    .controls{padding:10px 0 24px}
    .tally{grid-template-columns:repeat(2,1fr)}
    .tally button:nth-child(2n){border-right:0}
    .tally button:nth-child(-n+4){border-bottom:1px solid var(--line-soft)}
    .tally button:last-child{grid-column:1 / -1}
    .body{grid-template-columns:1fr;gap:24px;padding:12px 0 16px}
    .row{padding:20px 16px 14px}
    .strip>.lab{display:none}
    .strip>.out{padding-left:11px}
    .status{margin-left:0;width:100%}
  }
</style>

<div class="wrap">
  <header>
    <h1>선물포장 적요 생성기</h1>
    <p class="sub">포장 구성을 체크하면 적요(포장란)에 넣을 문구가 만들어집니다. 복사해서 이카운트·카페24에 그대로 붙여넣으세요.</p>
    <div class="tally-wrap"><div class="tally" id="tally"></div></div>
  </header>

  <div class="controls">
    <div class="searchrow">
      <input type="search" id="q" placeholder="상품명 · 브랜드 검색" autocomplete="off">
      <button class="btn-solid" id="addBtn">상품 추가</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="actionbar">
    <button class="act" id="copyAll">보이는 항목 적요 전체 복사</button>
    <button class="act" id="copyTsv">상품명 + 적요 복사 (시트용)</button>
    <button class="act" id="reset">체크 초기화</button>
    <button class="status" id="status" title="저장 기록 보기">불러오는 중…</button>
  </div>

  <div id="list"></div>
</div>

<dialog id="dlg"><div class="dlg">
  <h2 id="dlgTitle">복사</h2>
  <p>아래 내용을 길게 눌러 전체 선택 후 복사하세요.</p>
  <textarea id="dlgText" readonly></textarea>
  <div class="acts">
    <button id="dlgCopy" class="btn-solid">복사</button>
    <button id="dlgClose">닫기</button>
  </div>
</div></dialog>

<dialog id="histDlg"><div class="dlg">
  <h2>저장 기록</h2>
  <p>최근 저장 시점 10개까지 보관됩니다. 되돌리기를 하면 현재 상태도 기록에 남습니다.</p>
  <div class="hlist" id="histList"></div>
  <div class="acts">
    <button id="histClose">닫기</button>
  </div>
</div></dialog>

<script>
/* ── 포장 항목 정의 (시트의 9개 포장 컬럼) ── */
const OPTS = [
  {k:'G', g:'기타',   label:'전용 파우치', text:'전용 파우치'},
  {k:'A', g:'박스',   label:'공예 박스',   text:'공예 박스'},
  {k:'B', g:'박스',   label:'오동나무',    text:'오동나무 상자'},
  {k:'C', g:'박스',   label:'브랜드 전용', text:'전용 패키지 박스'},
  {k:'D', g:'보자기', label:'일반',        text:'보자기 포장'},
  {k:'E', g:'보자기', label:'브랜드 전용', text:'전용 보자기 포장'},
  {k:'F', g:'보자기', label:'+ 솔잎',      text:null, dep:true},
  {k:'H', g:'기타',   label:'쇼핑백',      text:'선물용 쇼핑백'},
];
const GROUPS = ['박스','보자기','기타'];
const ORDER = ['G','A','B','C','D','E','H'];

/* ── 상품 데이터 ── */
const D = (b,n,p,f,o={}) => ({brand:b,name:n,parts:p||'',flags:f||'',...o});
const SEED = [
  D('허명욱','[선물포장/한정수량] 동 컵 & 평접시 set (3ea) - 오프라인 픽업 수령 가능','동 컵 2ea, 평 접시(중) 1ea','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('수토','[선물포장/한정수량] 도자합 set (2ea) - 오프라인 픽업 수령 가능','설(Seol) 1ea, 수록(Surok) 1ea','DF',{tag:'선물포장/한정수량',pickup:1}),
  D('김현성','[선물포장/한정수량] 굽접시 set(2ea) - 오프라인 픽업 수령 가능','굽접시 2ea(S,L)','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('전상근','[선물포장/한정수량] 흑자 고블렛 set(2ea) - 오프라인 픽업 수령 가능','흑자 고블렛잔 2ea, 굽다리 찬기 1ea','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('김규태','[선물포장/한정수량] 고블렛잔 세트(2ea) - 오프라인 픽업 수령 가능','고블렛잔 2ea','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('전상근','[선물포장/한정수량] 도자 접시 세트(3ea) - 오프라인 픽업 수령 가능','화형접시 1ea, 오잎찬기 1ea, 백자기와 소반(중) 1ea','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('하경아','[선물포장/한정수량] 볼 & 컵 set(4ea) - 오프라인 픽업 수령 가능','stone cup 2ea, bowl mini 1ea, bowl S 1ea','ADF',{tag:'선물포장/한정수량',pickup:1}),
  D('이우철','[바로배송/선물포장] 버블 잔 세트(잔 + 보울) - 오프라인 픽업 수령 가능','버블 잔 2ea, 버블 보울 L 1ea','ADF',{tag:'바로배송/선물포장',pickup:1}),
  D('이우철','[바로배송/선물포장] 버블 굽 잔 세트(잔 + 보울) - 오프라인 픽업 수령 가능','버블 굽 잔 2ea, 버블 보울 L 1ea','ADF',{tag:'바로배송/선물포장',pickup:1}),
  D('김쥬쥬 스튜디오','[바로배송/선물포장] 세라믹 글라스 set(2ea) - 오프라인 픽업 수령 가능','세라믹 글라스 2ea (옵션 선택)','CDFH',{tag:'바로배송/선물포장',pickup:1,cond:'2점 구매 시'}),

  D('허명욱','[바로배송/한정수량] 옻칠 유기 술잔','술잔 1종','B',{tag:'바로배송/한정수량',cond:'2개 이상 구매 시'}),
  D('허명욱','[바로배송/한정수량] 유기 수저 세트','수저 한벌 세트 (숟가락 1개, 젓가락 1쌍)','',{tag:'바로배송/한정수량',check:'포장 정보 미기재'}),
  D('허명욱','[바로배송/한정수량] 동 컵','컵 1종','',{tag:'바로배송/한정수량',check:'포장 정보 미기재'}),
  D('허명욱','[바로배송/한정수량] 베싸개 테이블매트 (타원)','테이블매트 1개','',{tag:'바로배송/한정수량',check:'포장 정보 미기재'}),

  D('신원동','[바로배송/선물포장] 미니 화병 세트','화병 3종 (매병, 주병, 타원병 각1)','A',{tag:'바로배송/선물포장'}),
  D('이상호','[바로배송/선물포장] A PIECE OF PEACE Plate Set - Black','플레이트 세트 1종','H',{tag:'바로배송/선물포장',etc:'기프트 박스'}),
  D('이악크래프트','[바로배송/선물포장] 선샤인 쉬퍼 쿠페잔 (단품/세트)','단품: 쿠페잔 1개 / 세트: 쿠페잔 2개','',{etc:'단품: 개별 기프트 박스 / 세트: 개별 기프트 박스+더스트 포장'}),
  D('살랭','[프리오더 20%] 순면 거즈 아기 낮잠 이불 블랭킷 - 5색','블랭킷 1매','',{etc:'선물상자 포장 포함 (사용안내서·보증서 동봉)'}),
  D('이왈종','[선물포장] 아트오브제 - 5종','','',{tag:'선물포장',check:'적요 기재 필요 없음 (액자·패키지 포장 상태로 입고)'}),
  D('권녕미','쿠로하나 시리즈 - 고블렛잔 세트','고블렛 잔 2p (1set)','',{check:'포장 정보 미기재'}),
  D('권녕미','쿠로하나 시리즈 - 잔 세트','잔 2p (1set)','',{check:'포장 정보 미기재'}),
  D('청신','린넨 패브릭','패브릭 1종','',{check:'포장 정보 미기재'}),
];

const BRAND_ORDER = ['허명욱','수토','김현성','전상근','김규태','하경아','이우철',
  '김쥬쥬 스튜디오','스튜디오 윤여동','프린트베이커리','나임포터리','노은님','류종대',
  '바씨 밀라노','박선민','신원동','이상호','이악크래프트','살랭','이왈종','권녕미','청신'];

const STATUS = [
  {k:'all',    label:'전체 상품',     test:()=>true},
  {k:'set',    label:'포장 지정됨',   test:r=>hasAny(r)},
  {k:'none',   label:'미지정',        test:r=>!hasAny(r)},
  {k:'check',  label:'확인 필요',     test:r=>!!r.check},
  {k:'pickup', label:'오프라인 픽업', test:r=>!!r.pickup},
];

/* ── 상태 ── */
const KEY = 'pbg-gift-pkg:v2';
let rows = [];
let statusFilter = 'all';
let brandFilter = '전체';
let saveTimer = null;

function makeRow(seed, i){
  const f = {};
  OPTS.forEach(o => f[o.k] = (seed.flags||'').includes(o.k));
  const r = {
    id: seed.id || ('s'+i),
    brand: seed.brand, name: seed.name, parts: seed.parts,
    tag: seed.tag||'', check: seed.check||'', pickup: !!seed.pickup,
    f, etc: seed.etc||'', cond: seed.cond||'', override: seed.override ?? null, custom: !!seed.custom
  };
  /* c = 저장 확정된 상태. 목록/집계는 이 값 기준으로만 움직입니다. */
  r.c = seed.c ? {...seed.c} : snapOf(r);
  return r;
}
function snapOf(r){
  return {
    flags: OPTS.filter(o => r.f[o.k]).map(o => o.k).join(''),
    etc: r.etc||'', cond: r.cond||'', override: r.override ?? null
  };
}
const isDirty = r => JSON.stringify(snapOf(r)) !== JSON.stringify(r.c);
function applySnap(r, s){
  OPTS.forEach(o => r.f[o.k] = (s.flags||'').includes(o.k));
  r.etc = s.etc||''; r.cond = s.cond||''; r.override = s.override ?? null;
}

/* ── 적요 문구 조합 ── */
function buildFrom(has, etcRaw, condRaw, override){
  if (override !== null && override !== undefined) return override;
  const parts = [];
  for (const k of ORDER){
    if (!has(k)) continue;
    const o = OPTS.find(x => x.k === k);
    let t = o.text;
    if ((k === 'D' || k === 'E') && has('F')) t += '(솔잎)';
    parts.push(t);
  }
  const etc = (etcRaw||'').trim();
  if (etc) parts.push(etc);
  if (!parts.length) return '';
  const cond = (condRaw||'').trim();
  if (cond) parts[parts.length-1] += '(' + cond + ')';
  return parts.join(', ');
}
/* 화면에 보이는 작업 중 문구 */
function buildText(r){ return buildFrom(k => !!r.f[k], r.etc, r.cond, r.override); }
/* 저장 확정된 문구 — 필터와 집계는 이 값만 사용 */
function committedText(r){ return buildFrom(k => (r.c.flags||'').includes(k), r.c.etc, r.c.cond, r.c.override); }
const hasAny = r => committedText(r).trim().length > 0;

/* ── 렌더 ── */
const listEl = document.getElementById('list');

function matches(r){
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !(r.name+' '+r.brand+' '+r.parts).toLowerCase().includes(q)) return false;
  const st = STATUS.find(s => s.k === statusFilter);
  if (st && !st.test(r)) return false;
  if (brandFilter !== '전체' && r.brand !== brandFilter) return false;
  return true;
}
const visibleRows = () => rows.filter(matches);

function render(){
  listEl.innerHTML = '';
  const vis = visibleRows();
  if (!vis.length){
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.textContent = '조건에 맞는 상품이 없습니다. 검색어를 지우거나 위 집계에서 "전체 상품"을 눌러보세요.';
    listEl.appendChild(e);
  } else vis.forEach(r => listEl.appendChild(rowEl(r)));
  renderTally();
}

function rowEl(r){
  const el = document.createElement('div');
  el.className = 'row';

  const brand = document.createElement('div');
  brand.className = 'brand'; brand.textContent = r.brand;
  el.appendChild(brand);

  const body = document.createElement('div');
  body.className = 'body';
  el.appendChild(body);

  /* 좌측 */
  const L = document.createElement('div'); L.className = 'col-l';
  const lead = document.createElement('div'); lead.className = 'lead';
  const pn = document.createElement('div'); pn.className = 'pname'; pn.textContent = r.name;
  lead.appendChild(pn);
  if (r.parts){
    const ps = document.createElement('div'); ps.className = 'parts';
    ps.textContent = '구성품 : ' + r.parts;
    lead.appendChild(ps);
  }
  const fields = document.createElement('div'); fields.className = 'fields';
  fields.appendChild(txtInput('기타 구성품 추가시 입력 (예: 기프트 박스)', r.etc, v => { r.etc = v; r.override = null; }, () => sync()));
  fields.appendChild(txtInput('조건 추가시 입력 (예: 2점 구매 시)', r.cond, v => { r.cond = v; r.override = null; }, () => sync()));
  lead.appendChild(fields);
  L.appendChild(lead);

  const tail = document.createElement('div'); tail.className = 'tail';
  const pills = document.createElement('div'); pills.className = 'pills';
  if (r.tag){ const p = document.createElement('span'); p.className='pill tag'; p.textContent=r.tag; pills.appendChild(p); }
  if (r.pickup){ const p = document.createElement('span'); p.className='pill tag'; p.textContent='오프라인 픽업'; pills.appendChild(p); }
  if (r.check){ const p = document.createElement('span'); p.className='pill chk'; p.textContent='확인 필요'; pills.appendChild(p); }
  if (pills.children.length) tail.appendChild(pills);
  if (r.check){
    const n = document.createElement('div'); n.className='note'; n.textContent = '· ' + r.check;
    tail.appendChild(n);
  }
  L.appendChild(tail);
  body.appendChild(L);

  /* 우측 */
  const R = document.createElement('div'); R.className = 'col-r';
  const rtop = document.createElement('div'); rtop.className='r-top';
  const rh = document.createElement('div'); rh.className='r-head';
  rh.textContent = '선물 포장 클릭 시 하단 적요란에 추가';
  rtop.appendChild(rh);
  const racts = document.createElement('div'); racts.className='r-acts';
  const saveBtn = document.createElement('button');
  saveBtn.className='rsave'; saveBtn.type='button'; saveBtn.textContent='해당 설정 저장';
  saveBtn.onclick = () => {
    r.c = snapOf(r);
    pushHistory(r.brand + ' · ' + r.name);
    save();
    saveBtn.textContent='저장됨'; saveBtn.classList.add('done'); saveBtn.disabled = true;
    setTimeout(render, 600);
  };
  racts.appendChild(saveBtn);

  const undoBtn = document.createElement('button');
  undoBtn.className='ricon'; undoBtn.type='button';
  undoBtn.title='변경 취소 · 마지막 저장 상태로'; undoBtn.setAttribute('aria-label','변경 취소');
  undoBtn.innerHTML = '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<path d="M2.5 10C2.5 11.4834 2.93987 12.9334 3.76398 14.1668C4.58809 15.4001 5.75943 16.3614 7.12987 16.9291C8.50032 17.4968 10.0083 17.6453 11.4632 17.3559C12.918 17.0665 14.2544 16.3522 15.3033 15.3033C16.3522 14.2544 17.0665 12.918 17.3559 11.4632C17.6453 10.0083 17.4968 8.50032 16.9291 7.12987C16.3614 5.75943 15.4001 4.58809 14.1668 3.76398C12.9334 2.93987 11.4834 2.5 10 2.5C7.90329 2.50789 5.89081 3.32602 4.38333 4.78333L2.5 6.66667M6.66667 6.66667H2.5V2.5" '
    + 'stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  undoBtn.onclick = () => {
    applySnap(r, r.c);
    save();
    el.replaceWith(rowEl(r));
  };
  racts.appendChild(undoBtn);
  rtop.appendChild(racts);
  R.appendChild(rtop);

  const groups = document.createElement('div'); groups.className='groups';
  GROUPS.forEach(g => {
    const gw = document.createElement('div'); gw.className='group';
    const gl = document.createElement('div'); gl.className='g-label'; gl.textContent=g;
    gw.appendChild(gl);
    const cw = document.createElement('div'); cw.className='chips';
    OPTS.filter(o => o.g === g).forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (o.dep ? ' dep' : '');
      b.type = 'button'; b.textContent = o.label;
      b.setAttribute('aria-pressed', String(!!r.f[o.k]));
      b.onclick = () => {
        r.f[o.k] = !r.f[o.k]; r.override = null;
        b.setAttribute('aria-pressed', String(!!r.f[o.k]));
        sync(); save();
      };
      cw.appendChild(b);
    });
    gw.appendChild(cw);
    groups.appendChild(gw);
  });
  R.appendChild(groups);

  const warn = document.createElement('div'); warn.className='warn';
  warn.textContent = '솔잎은 보자기 포장에 붙는 옵션입니다. 보자기 항목을 함께 체크하세요.';
  R.appendChild(warn);

  const text = buildText(r);
  const strip = document.createElement('div'); strip.className='strip';
  const lab = document.createElement('div'); lab.className='lab'; lab.textContent='적요';
  strip.appendChild(lab);
  const out = document.createElement('textarea');
  out.className='out'; out.rows=1; out.value=text; out.spellcheck=false;
  out.placeholder = '포장 항목을 체크하면 여기에 문구가 만들어집니다';
  out.setAttribute('aria-label', r.name + ' 적요 문구');
  out.addEventListener('input', () => { r.override = out.value; autoGrow(out); sync(); save(); });
  strip.appendChild(out);
  const cp = document.createElement('button');
  cp.className='cp'; cp.type='button'; cp.textContent='복사';
  cp.onclick = () => {
    if (!out.value.trim()) return setStatus('복사할 문구가 없습니다.');
    copy(out.value, () => {
      cp.textContent='복사됨'; cp.classList.add('done');
      setTimeout(()=>{cp.textContent='복사';cp.classList.remove('done');},1400);
    }, '적요 문구');
  };
  strip.appendChild(cp);
  R.appendChild(strip);
  requestAnimationFrame(()=>autoGrow(out));

  const enote = document.createElement('div'); enote.className='editnote';
  const espan = document.createElement('span'); espan.textContent='직접 수정한 문구입니다';
  enote.appendChild(espan);
  const ebtn = document.createElement('button');
  ebtn.textContent = '체크 기준으로 되돌리기';
  ebtn.onclick = () => { r.override = null; sync(); save(); };
  enote.appendChild(ebtn);
  R.appendChild(enote);

  /* 행 내부만 갱신 — 목록 재정렬은 저장 버튼을 눌렀을 때만 일어납니다 */
  function sync(){
    if (r.override === null || r.override === undefined){
      out.value = buildText(r); autoGrow(out);
    }
    warn.style.display = (r.f.F && !r.f.D && !r.f.E) ? '' : 'none';
    enote.style.display = (r.override !== null && r.override !== undefined) ? '' : 'none';
    const d = isDirty(r);
    racts.style.display = d ? '' : 'none';
    saveBtn.disabled = false;
    saveBtn.classList.remove('done');
    saveBtn.textContent = '해당 설정 저장';
  }
  sync();

  body.appendChild(R);
  return el;
}

function txtInput(ph, val, onchange, after){
  const i = document.createElement('input');
  i.type='text'; i.placeholder=ph; i.value = val || '';
  i.addEventListener('input', () => { onchange(i.value); after && after(); save(); });
  return i;
}
function autoGrow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }

/* ── 집계 = 상태 필터 ── */
function renderTally(){
  const box = document.getElementById('tally');
  const q = document.getElementById('q').value.trim().toLowerCase();
  const scope = rows.filter(r => {
    if (q && !(r.name+' '+r.brand+' '+r.parts).toLowerCase().includes(q)) return false;
    if (brandFilter !== '전체' && r.brand !== brandFilter) return false;
    return true;
  });
  box.innerHTML = '';
  STATUS.forEach(s => {
    const b = document.createElement('button');
    b.type='button';
    b.setAttribute('aria-pressed', String(statusFilter === s.k));
    b.innerHTML = '<b>' + scope.filter(s.test).length + '</b><span>' + s.label + '</span>';
    b.onclick = () => {
      statusFilter = (statusFilter === s.k && s.k !== 'all') ? 'all' : s.k;
      render();
    };
    box.appendChild(b);
  });
}

function renderFilters(){
  const present = new Set(rows.map(r => r.brand));
  const known = BRAND_ORDER.filter(b => present.has(b));
  const extras = [...present].filter(b => !BRAND_ORDER.includes(b));
  const box = document.getElementById('filters');
  box.innerHTML = '';
  const add = o => {
    const b = document.createElement('button');
    b.className='fchip'; b.type='button'; b.textContent=o;
    b.setAttribute('aria-pressed', String(brandFilter === o));
    b.onclick = () => { brandFilter = o; renderFilters(); render(); };
    box.appendChild(b);
  };
  ['전체', ...known, ...extras].forEach(add);
}

/* ── 복사 ── */
function copy(text, onOk, label){
  const done = () => { setStatus((label||'내용') + ' 복사됨'); onOk && onOk(); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done,label));
  } else fallback(text, done, label);
}
function fallback(text, done, label){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if (ok) done(); else {
    const d = document.getElementById('dlg');
    document.getElementById('dlgTitle').textContent = label || '복사';
    document.getElementById('dlgText').value = text;
    d.showModal();
  }
}
document.getElementById('dlgClose').onclick = () => document.getElementById('dlg').close();
document.getElementById('dlgCopy').onclick = () => {
  const t = document.getElementById('dlgText');
  t.removeAttribute('readonly'); t.select();
  try { document.execCommand('copy'); setStatus('복사됨'); } catch(e){}
  t.setAttribute('readonly','');
};

document.getElementById('copyAll').onclick = () => {
  const v = visibleRows().map(buildText);
  if (!v.length) return setStatus('복사할 항목이 없습니다.');
  copy(v.join('\n'), null, '적요 ' + v.length + '건');
};
document.getElementById('copyTsv').onclick = () => {
  const v = visibleRows();
  if (!v.length) return setStatus('복사할 항목이 없습니다.');
  copy(v.map(r => [r.brand, r.name, buildText(r)].join('\t')).join('\n'), null, '표 ' + v.length + '행');
};
document.getElementById('reset').onclick = () => {
  if (!confirm('모든 체크와 직접 수정 내용을 원본 시트 상태로 되돌립니다. 진행할까요?')) return;
  pushHistory('초기화 직전 상태');
  rows = SEED.map(makeRow);
  save(); renderFilters(); render();
  setStatus('원본 상태로 되돌렸습니다.');
};
document.getElementById('addBtn').onclick = () => {
  const name = prompt('상품명을 입력하세요');
  if (!name || !name.trim()) return;
  const brand = (prompt('브랜드명을 입력하세요') || '직접 추가').trim();
  const r = makeRow({brand, name:name.trim(), parts:'', flags:'', custom:true}, 'c'+Date.now());
  r.id = 'c'+Date.now();
  rows.unshift(r);
  brandFilter='전체'; statusFilter='all';
  document.getElementById('q').value='';
  save(); renderFilters(); render();
  setStatus('상품을 추가했습니다.');
};

/* ── 저장소 어댑터 ──
   Claude 아티팩트 안에서는 window.storage,
   일반 웹서버에 올렸을 때는 브라우저 로컬 저장을 사용합니다. */
const STORE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function')
  ? {
      kind:'claude',
      async get(k){ const r = await window.storage.get(k); return r && r.value ? r.value : null; },
      async set(k,v){ await window.storage.set(k,v); }
    }
  : {
      kind:'local',
      async get(k){ return localStorage.getItem(k); },
      async set(k,v){ localStorage.setItem(k,v); }
    };

/* ── 저장 ── */
function serialize(){
  return JSON.stringify(rows.map(r => ({
    id:r.id, brand:r.brand, name:r.name, parts:r.parts, tag:r.tag,
    check:r.check, pickup:r.pickup,
    flags: OPTS.filter(o => r.f[o.k]).map(o => o.k).join(''),
    etc:r.etc, cond:r.cond, override:r.override, custom:r.custom, c:r.c
  })));
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await STORE.set(KEY, serialize());
      setStatus('저장됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    } catch(e){ setStatus('저장에 실패했습니다. 복사 기능은 그대로 쓸 수 있습니다.'); }
  }, 450);
}
function setStatus(s){ document.getElementById('status').textContent = s; }

/* ── 저장 기록 ── */
const HKEY = KEY + ':hist';
let hist = [];

function summarize(data){
  try {
    const arr = JSON.parse(data);
    let set = 0;
    arr.forEach(o => {
      const c = o.c || {flags:o.flags, etc:o.etc, cond:o.cond, override:o.override};
      if (buildFrom(k => (c.flags||'').includes(k), c.etc, c.cond, c.override).trim()) set++;
    });
    return '지정 ' + set + '건 · 미지정 ' + (arr.length - set) + '건';
  } catch(e){ return ''; }
}

function pushHistory(label){
  const data = serialize();
  hist.unshift({ t:Date.now(), label:label||'저장', sum:summarize(data), data });
  hist = hist.slice(0, 10);
  STORE.set(HKEY, JSON.stringify(hist)).catch(()=>{});
}

function openHistory(){
  const box = document.getElementById('histList');
  box.innerHTML = '';
  if (!hist.length){
    const e = document.createElement('div'); e.className='hempty';
    e.textContent = '아직 저장 기록이 없습니다. 상품별 "해당 설정 저장"을 누르면 그 시점이 기록됩니다.';
    box.appendChild(e);
  } else {
    hist.forEach((v, i) => {
      const it = document.createElement('div'); it.className='hitem';
      const t = document.createElement('div'); t.className='ht';
      const tt = document.createElement('div'); tt.className='htime';
      tt.textContent = new Date(v.t).toLocaleString('ko-KR',
        {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + (i === 0 ? ' · 최신' : '');
      const ss = document.createElement('div'); ss.className='hsum';
      ss.textContent = (v.label||'') + (v.sum ? ' · ' + v.sum : '');
      t.appendChild(tt); t.appendChild(ss); it.appendChild(t);
      const b = document.createElement('button');
      b.type='button'; b.textContent = '이 버전으로';
      b.onclick = () => {
        if (!confirm('이 시점 상태로 되돌립니다. 지금 상태는 기록에 남습니다. 진행할까요?')) return;
        pushHistory('되돌리기 직전 상태');
        rows = JSON.parse(v.data).map(makeRow);
        save(); renderFilters(); render();
        document.getElementById('histDlg').close();
        setStatus('이전 버전으로 되돌렸습니다.');
      };
      it.appendChild(b);
      box.appendChild(it);
    });
  }
  document.getElementById('histDlg').showModal();
}

document.getElementById('status').onclick = openHistory;
document.getElementById('histClose').onclick = () => document.getElementById('histDlg').close();

async function load(){
  let saved = null;
  try {
    const raw = await STORE.get(KEY);
    if (raw) saved = JSON.parse(raw);
  } catch(e){}
  try {
    const h = await STORE.get(HKEY);
    if (h) hist = JSON.parse(h) || [];
  } catch(e){}
  if (Array.isArray(saved) && saved.length){
    rows = saved.map(makeRow);
    setStatus('이전 작업을 불러왔습니다.');
  } else {
    rows = SEED.map(makeRow);
    setStatus('원본 시트 기준으로 시작합니다.');
  }
  renderFilters(); render();
}

document.getElementById('q').addEventListener('input', render);
load();
</script>
